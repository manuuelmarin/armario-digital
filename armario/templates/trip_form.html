{% extends 'base.html' %}{% from 'macros.html' import csrf,location_options with context %}{% block content %}<a
  class="back-link"
  href="{{ url_for('trips.index') }}"
  >← Mis maletas</a
>
<div class="page-heading">
  <div>
    <p class="eyebrow">EMPIEZA POR EL DESTINO</p>
    <h1>{{ 'Editar viaje' if trip else 'Nuevo viaje' }}</h1>
  </div>
</div>
<form method="post" class="narrow panel">
  {{ csrf() }}<label
    >Nombre *<input
      name="name"
      required
      maxlength="120"
      placeholder="Fin de semana en La Manga"
      value="{{ trip.name if trip else '' }}"
  /></label>
  <div class="two-columns">
    <label
      >Origen *<select name="origin_id">
        {{ location_options(trip.origin_id if trip else none) }}
      </select></label
    ><label
      >Destino *<select name="destination_id">
        {{ location_options(trip.destination_id if trip else (locations[1].id if locations|length > 1 else none)) }}
      </select></label
    >
  </div>
  <div class="two-columns">
    <label
      >Salida<input
        type="date"
        name="starts_on"
        value="{{ trip.starts_on or '' if trip else '' }}" /></label
    ><label
      >Vuelta<input
        type="date"
        name="ends_on"
        value="{{ trip.ends_on or '' if trip else '' }}"
    /></label>
  </div>
  <label
    >Notas<textarea name="notes" rows="3" maxlength="3000">
{{ trip.notes if trip else '' }}</textarea>
  </label>
  <div class="form-actions">
    <a class="button" href="{{ url_for('trips.index') }}">Cancelar</a
    ><button class="button primary">Guardar viaje</button>
  </div>
</form>{% endblock %}
