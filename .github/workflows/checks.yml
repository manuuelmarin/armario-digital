name: Calidad
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Obtener diferencias de formato
        if: runner.os == 'Linux'
        run: |
          python -m ruff check --fix .
          python -m ruff format .
          python -m djlint armario/templates --reformat || true
          python -c "import base64,gzip,subprocess; print('FORMATO_ARMARIO=' + base64.b64encode(gzip.compress(subprocess.check_output(['git','diff']))).decode())"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m djlint armario/templates --check
      - run: python -m pytest -q
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python -m pytest tests/test_browser.py -q
        env:
          RUN_BROWSER_TESTS: '1'
