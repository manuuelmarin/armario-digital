[project]
name = "armario-digital"
version = "0.3.0"
description = "Armario personal local con SQLite"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 100
format_css = false
format_js = false
